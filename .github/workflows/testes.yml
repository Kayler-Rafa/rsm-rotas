name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Sem dependencias: o backend usa so a biblioteca padrao.
      - name: Testes de corretude
        run: python -m unittest discover -s tests -v
